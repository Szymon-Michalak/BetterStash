name: Bug report
description: Report behavior that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: bitbucket
    attributes:
      label: Bitbucket Server or Data Center version
      description: Do not include your company URL or other private information.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include reproduction steps and sanitized screenshots when useful.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Remove names, repository URLs, and other sensitive data before posting.
      render: shell
