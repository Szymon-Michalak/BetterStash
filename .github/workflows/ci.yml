name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
            script: package.sh
          - browser: safari
            os: macos-15
            script: package-safari.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./scripts/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: better-stash-${{ matrix.browser }}
          path: dist/*.zip
          if-no-files-found: error
