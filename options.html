<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BetterStash</title>
  <style>
    :root {
      --accent: #0747a6;
      --accent-dark: #063789;
      --ink: #172b4d;
      --muted: #6b778c;
      --border: #dfe1e6;
      --surface: #f7f8fa;
    }
    * { box-sizing: border-box; }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      margin: 0;
      padding: 0 0 16px;
      width: 340px;
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
    }
    header .logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }
    h1 { font-size: 14px; margin: 0; font-weight: 600; }
    main { padding: 0 16px; }
    section.card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 14px;
    }
    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--accent);
      font-weight: 700;
      margin: 0 0 8px;
      padding-left: 9px;
      border-left: 3px solid var(--accent);
      line-height: 1.3;
    }
    label.row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      cursor: pointer;
      border-radius: 4px;
    }
    label.row:hover { background: rgba(7, 71, 166, 0.06); }
    label.row input { margin: 0; accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
    .field label { display: block; margin-bottom: 4px; color: var(--muted); font-weight: 600; }
    .field input[type=text] {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font: inherit;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .field input[type=text]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(7, 71, 166, 0.15);
    }
    .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button {
      border: 0;
      border-radius: 5px;
      padding: 7px 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: background-color 0.12s ease, transform 0.06s ease;
    }
    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }
    button.secondary { background: #ebecf0; color: var(--ink); }
    button.secondary:hover { background: #dfe1e6; }
    .connection-status { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
    .status { margin-top: 14px; padding: 0 16px; color: #00875a; font-size: 12px; min-height: 1em; }
    .status.error { color: #de350b; }
  </style>
</head>
<body>
  <header>
    <span class="logo">B</span>
    <h1>BetterStash</h1>
  </header>

  <main>
  <section class="card">
    <div class="field">
      <label for="siteUrl">Bitbucket Server URL</label>
      <input type="text" id="siteUrl" placeholder="https://stash.example.com">
      <div class="hint">Only this origin receives access. Paths and credentials are discarded.</div>
      <div class="actions">
        <button type="button" id="connectSite">Connect site</button>
        <button type="button" class="secondary" id="disconnectSite" hidden>Disconnect</button>
      </div>
      <div class="connection-status" id="connectionStatus"></div>
    </div>
  </section>

  <section class="card">
    <h2>Identity</h2>
    <div class="field">
      <label for="identity">Your display name</label>
      <input type="text" id="identity" placeholder="e.g. Taylor Morgan">
      <div class="hint">Exactly as shown on reviewer avatars. Separate alternatives with commas.</div>
    </div>
  </section>

  <section class="card">
    <h2>Team</h2>
    <div class="field">
      <label for="team">Team members</label>
      <input type="text" id="team" placeholder="e.g. Alex Kim, Jordan Lee">
      <div class="hint">Display names, comma-separated.</div>
    </div>
    <label class="row"><input type="checkbox" id="teamTint"> Subtle blue row tint</label>
    <label class="row"><input type="checkbox" id="teamIcon"> Small team badge after the author name</label>
    <label class="row"><input type="checkbox" id="pinTeam"> Pin team PRs to top of "to review"</label>
  </section>

  <section class="card">
    <h2>Auto-expand "Show more pull requests"</h2>
    <label class="row"><input type="checkbox" id="expandReview"> Pull requests to review</label>
    <label class="row"><input type="checkbox" id="expandYours"> Your pull requests</label>
    <label class="row"><input type="checkbox" id="expandClosed"> Recently closed pull requests</label>
  </section>

  <section class="card">
    <h2>Sections</h2>
    <label class="row"><input type="checkbox" id="tierBlocked"> Blocked (conflicts / failed builds)</label>
    <label class="row"><input type="checkbox" id="tierApproved"> Approved by me</label>
    <label class="row"><input type="checkbox" id="tierWip"> Work in progress</label>
    <label class="row"><input type="checkbox" id="dimRows"> Dim rows in Approved / WIP</label>
  </section>

  <section class="card">
    <h2>Diff view</h2>
    <label class="row"><input type="checkbox" id="fileNav"> Prev/next file navigation (buttons + <code>[</code> / <code>]</code>)</label>
  </section>

  <section class="card">
    <h2>Dashboard</h2>
    <label class="row"><input type="checkbox" id="zenMode"> Zen mode (hide sidebar, narrow + center the main panel)</label>
  </section>
  </main>

  <div class="status" id="status"></div>
  <script src="site-config.js"></script>
  <script src="options.js"></script>
</body>
</html>
